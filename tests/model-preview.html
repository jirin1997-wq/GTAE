<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><title>Náhled modelu</title>
<script type="importmap">{"imports":{"three":"../node_modules/three/build/three.module.js","three/addons/":"../node_modules/three/examples/jsm/"}}</script>
<style>body{margin:0;background:#888}</style></head>
<body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const params = new URLSearchParams(location.search);
const url = params.get('model');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(640, 360);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x889aa8);
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.5));
const sun = new THREE.DirectionalLight(0xffffff, 2); sun.position.set(5, 10, 8); scene.add(sun);
const camera = new THREE.PerspectiveCamera(40, 640 / 360, 0.1, 1000);
const gltf = await new GLTFLoader().loadAsync(url);
const root = gltf.scene;
const box = new THREE.Box3().setFromObject(root);
const size = box.getSize(new THREE.Vector3());
const center = box.getCenter(new THREE.Vector3());
// Normalizace: nejdelší osa = 4 jednotky, střed v počátku
const s = 4 / Math.max(size.x, size.y, size.z);
root.scale.setScalar(s);
root.position.sub(center.multiplyScalar(s));
scene.add(root);
const d = 7;
// pohled ze strany +z (kamera na +z), potom ze strany -z
const view = params.get('view') === 'back' ? -1 : 1;
camera.position.set(d * 0.5, 2.5, view * d);
camera.lookAt(0, 0.5, 0);
renderer.render(scene, camera);
document.title = 'ok';
</script></body></html>
